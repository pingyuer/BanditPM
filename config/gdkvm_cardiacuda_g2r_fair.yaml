defaults:
  - gdkvm_cardiacuda_g2r
  - _self_

exp_id: "gdkvm_cardiacuda_g2r_fair"
prediction_mode: "dense10"
target_index: -1
temporal_access: "recurrent"

model:
  backbone_pretrained: false
  pretrain_source: "none"

main_training:
  num_iterations: 4000
  batch_size: 8
  lr_schedule: warmup_cosine
  lr_warmup_iters: 300
  lr_min_ratio: 0.05

mlflow:
  experiment_name: "fair_debel_gdkvm_six_tasks"
  run_name: "gdkvm_cardiacuda_g2r_fair"
  tags:
    method: "GDKVM"
    dataset: "cardiacuda"
    protocol: "G_to_R"
    task: "cardiacuda_g2r"
    temporal_access: "recurrent"
    prediction_mode: "dense10"
    backbone_pretrained: "false"
