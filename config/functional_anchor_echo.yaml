defaults:
  - echonet_ed2es_endpoint_predinit
  - _base_/datasets/echo
  - _base_/models/functional_anchor
  - _base_/runtime/default_runtime
  - _base_/schedules/default_3k
  - _self_

exp_id: "functional_anchor_echo"

main_training:
  num_iterations: 4000
  lr_schedule: step
  lr_schedule_steps: [2000, 3200]
  lr_schedule_gamma: 0.1
  unext_lr_ratio: 0.5
  functional_anchor_lr_ratio: 1.0
  residual_head_lr_mult: 5.0
  use_ema: false
  ema_eval: false

model:
  functional_anchor:
    phase:
      normalized_time_weight: 0.1
      normalized_time_weight_echo: 0.1
      area_curve_weight_echo: 1.0
    lambda_phase_consistency: 0.005
    lambda_slot_area_order: 0.005
    lambda_phase_slot_correlation: 0.002

evaluation:
  protocol_version: "v3_functional_anchor"
  threshold_search_start: 0.30
  threshold_search_end: 0.75
  threshold_search_step: 0.01
  tta:
    enabled: false
    modes: ["identity"]
  postprocess:
    enabled: true
    largest_component: true
    fill_holes: true
    remove_small_objects: true
    min_size: 16
    binary_closing: true
