defaults:
  - unext_faf_echo_online
  - _self_

exp_id: "unext_faf_echo_ablate_anchor_primary_oracle_debug"
ablation_type: "affine_mixture_oracle_debug"

model:
  unext_faf:
    disable_trust_gate: true
    residual_scale:
      init: 0.10
      max: 0.25
      warmup_iters: 500
    prediction_mode: "affine_mixture"
    lambda_faf_mixture: 1.0
    lambda_faf_base: 1.0
    lambda_faf_residual_smallness: 0.0
