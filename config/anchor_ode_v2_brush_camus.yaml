defaults:
  - anchor_ode_v2_hparam_camus_c1
  - _self_

exp_id: "anchor_ode_v2_brush_camus"


main_training:
  use_ema: true
  ema_decay: 0.999
  ema_start_iter: 100
  ema_eval: true

evaluation:
  protocol_version: "v3_current_anchor_affine"
  threshold_search_start: 0.35
  threshold_search_end: 0.65
  threshold_search_step: 0.01
  best_ckpt_metric: "best_threshold_dice_frame_mean"
  tta:
    enabled: true
    modes: ["identity", "hflip"]
  postprocess:
    enabled: true
    largest_component: true
    fill_holes: true
    remove_small_objects: true
    min_size: 8
    binary_closing: false
