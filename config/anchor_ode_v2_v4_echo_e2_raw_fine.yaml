defaults:
  - anchor_ode_v2_hparam_echo_e2
  - _self_

exp_id: "anchor_ode_v2_v4_echo_e2_raw_fine"


main_training:
  num_iterations: 4000
  lr_schedule: step
  lr_schedule_steps: [2000, 3200]
  lr_schedule_gamma: 0.1
  unext_lr_ratio: 1.0
  anchor_ode_lr_ratio: 1.0
  use_ema: false
  ema_eval: false

evaluation:
  protocol_version: "v3_current_anchor_affine"
  threshold_search_start: 0.30
  threshold_search_end: 0.75
  threshold_search_step: 0.01
  tta:
    enabled: false
    modes: ["identity"]
  postprocess:
    enabled: true
    largest_component: true
    fill_holes: true
    remove_small_objects: true
    min_size: 16
    binary_closing: true
