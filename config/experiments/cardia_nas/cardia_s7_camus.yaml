# S7: 低温度selector + 大hidden — 强选择能力
defaults:
  - cardia_v2_camus
  - _self_
exp_id: "cardia_s7_camus_cold_selector"
model:
  cardia:
    hidden_dim: 256
    stage2_num_heads: 4
    stage2_head_scales: [0.4, 0.8, 1.2, 1.8]
    stage2_max_offset_px: 3.5
    selector_logit_scale_init: 0.3
    selector_logit_scale_max: 2.0
    write_gate_bias: 0.0
    lambda_head_diversity: 0.05
    lambda_cardia_selector_global: 0.05
    lambda_cardia_selector_spatial: 0.08
main_training:
  batch_size: 2
mlflow:
  experiment_name: "cardia_nas"
  tags: { method: "CARDIA_s7", version: "s7_cold_selector_h256" }
