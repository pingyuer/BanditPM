defaults:
  - config_unext_dynakey
  - _self_

exp_id: "unext_dynakey_spatial_v2_no_leak"
model_name: "UNeXtDynaKeySpatial"


model:
  unext_dynakey:
    use_dynakey: true
    dynakey_memory_mode: "spatial"
    use_phase_retrieval: true
    readout_type: "spatial_gate"
    dynamics_mode: "spatial"
    q_policy_mode: "off"
    enable_q_loss: false
    use_temporal_refine: true
    use_mask_memory: false
    use_memory_readout: false
