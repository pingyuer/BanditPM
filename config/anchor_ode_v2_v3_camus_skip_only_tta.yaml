defaults:
  - anchor_ode_v2_hparam_camus_c3
  - _self_

exp_id: "anchor_ode_v2_v3_camus_skip_only_tta"


model:
  anchor_ode:
    decoder_guidance_enabled: false

main_training:
  num_iterations: 3000
  unext_lr_ratio: 1.0
  anchor_ode_lr_ratio: 1.0
  use_ema: false
  ema_eval: false

evaluation:
  protocol_version: "v3_current_anchor_affine"
  threshold_search_start: 0.30
  threshold_search_end: 0.75
  threshold_search_step: 0.01
  tta:
    enabled: true
    modes: ["identity", "hflip"]
  postprocess:
    enabled: true
    largest_component: true
    fill_holes: true
    remove_small_objects: true
    min_size: 8
    binary_closing: false
