defaults:
  - config_gdkvm_01
  - _self_

exp_id: "delay_ode"
model_name: "DelayODE"
output_root: "outputs/BanditPM"

phase_init:
  train: "pred_or_zero"
  val: "pred_or_zero"
  test: "pred_or_zero"

evaluation:
  init_mode: "pred_or_zero"
  exclude_init_frame: true
  init_frame_index: 0
  protocol_version: "delay_ode_warmup_no_leak"
  default_threshold: 0.5
  threshold_search_start: 0.30
  threshold_search_end: 0.70
  threshold_search_step: 0.05


model:
  name: "delay_ode"
  allow_oracle_init_when_requested: false
  use_first_frame_gt_init: false
  use_kpff: false
  memory_core:
    type: "none"
    dynakey: {}
  temporal_memory:
    type: "none"
    bpm:
      ENABLE: false
  delay_ode:
    in_channels: 1
    num_classes: 2
    base_dim: 32
    delay_ode_num_slots: 8
    delay_ode_key_dim: 64
    delay_ode_value_dim: 64
    delay_ode_state_dim: 128
    delay_ode_temperature: 0.07
    delay_ode_dt: 1.0
    delay_ode_steps: 1
    delay_ode_gamma: 0.1
    delay_ode_use_low: true
    delay_ode_use_mid: true
    delay_ode_use_high: true
    delay_ode_keymap_ema: 0.85
    delay_ode_update_gate_max: 0.5
    delay_ode_keymap_gate_max: 0.35
    delay_ode_latent_gate_max: 0.65
    delay_ode_state_gate_max: 0.25
    delay_ode_first_frame_init: "strong_initnet"
    delay_ode_use_strong_initializer: true
    delay_ode_use_decodable_latent_regularizer: true
    delay_ode_use_boundary_decoder: true
    delay_ode_use_adaptive_motion_scale: true
    delay_ode_gate_mode: "separated"
    delay_ode_curriculum:
      stage: "full_rollout"
      rollout_length_schedule: [2, 3, 5, "full"]
    delay_ode_first_frame_mode: "warmup_only"
    delay_ode_supervise_first_frame: false
    delay_ode_detach_mask_for_update: true
    delay_ode_allow_current_feature_for_current_mask: false
    delay_ode_lambda_slot_balance: 0.001
    delay_ode_lambda_phase_slot_usage: 0.001
    delay_ode_lambda_latent_decode_low: 0.01
    delay_ode_lambda_latent_decode_mid: 0.01
    delay_ode_lambda_latent_decode_high: 0.01
    delay_ode_lambda_boundary: 0.01
    delay_ode_lambda_motion_scale_smooth: 0.01
    delay_ode_lambda_gate_smooth: 0.01
    delay_ode_lambda_latent_smooth: 0.01
    delay_ode_lambda_state_smooth: 0.01

hydra:
  run:
    dir: ${output_root}/${exp_id}/${now:%Y-%m-%d}/${now:%H-%M-%S}
