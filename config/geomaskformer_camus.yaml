defaults:
  - camus_short_dense_predinit
  - _base_/datasets/camus
  - /_base_/models/geomaskformer@_global_
  - _base_/runtime/default_runtime
  - _base_/schedules/default_3k
  - _self_

exp_id: "geomaskformer_camus"

data_path: "${data_root}/camus/processed/camus_png256_10f"

main_training:
  crop_size: [128, 128]
  num_iterations: 4000
  batch_size: 4
  num_workers: 4
  lr_schedule: warmup_cosine
  lr_warmup_iters: 300
  lr_min_ratio: 0.05
  geomaskformer_lr_ratio: 1.0
  geomaskformer_prompt_lr_mult: 1.5
  geomaskformer_proposal_lr_mult: 1.2
  geomaskformer_quality_lr_mult: 2.0
  backbone_lr_ratio: 0.5
  use_ema: false
  ema_eval: false

evaluation:
  protocol_version: "v3_canonical_no_leak"
  threshold_search_during_training: false
  threshold_search_start: 0.30
  threshold_search_end: 0.75
  threshold_search_step: 0.01
  tta:
    enabled: true
    modes: ["identity", "hflip"]
  postprocess:
    enabled: true
    largest_component: true
    fill_holes: true
    remove_small_objects: true
    min_size: 8
    binary_closing: false

eval_stage:
  crop_size: [128, 128]
  test_every_eval: false
  eval_interval: 500
  num_vis: 1

mlflow:
  experiment_name: "geomaskformer"
  tags:
    method: "GeoMaskFormer"
    dataset: "camus"
    view: "A4C"
    protocol: "stage2_masked_completion"
    selection: "top1_quality"
