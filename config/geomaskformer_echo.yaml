defaults:
  - echonet_ed2es_endpoint_predinit
  - _base_/datasets/echo
  - /_base_/models/geomaskformer@_global_
  - _base_/runtime/default_runtime
  - _base_/schedules/default_3k
  - _self_

exp_id: "geomaskformer_echo"

main_training:
  num_iterations: 4000
  batch_size: 4
  num_workers: 4
  lr_schedule: warmup_cosine
  lr_warmup_iters: 300
  lr_min_ratio: 0.05
  geomaskformer_lr_ratio: 1.0
  backbone_lr_ratio: 0.5
  use_ema: false
  ema_eval: false

eval_stage:
  test_every_eval: false
  eval_interval: 500
  num_vis: 1

mlflow:
  experiment_name: "geomaskformer"
  tags:
    method: "GeoMaskFormer"
    dataset: "echonet"
    view: "A4C"
    protocol: "stage2_masked_completion"
    selection: "top1_quality"
