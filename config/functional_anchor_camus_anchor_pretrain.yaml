defaults:
  - functional_anchor_camus
  - _self_

exp_id: "functional_anchor_camus_anchor_pretrain"

model:
  functional_anchor:
    training_stage: "anchor_pretrain"
    prediction_mode: "anchor_primary"
    lambda_anchor: 1.0
    lambda_base_seg: 0.2
    lambda_residual_smallness: 0.1
    lambda_boundary_residual: 0.02
    lambda_phase_consistency: 0.1
    lambda_anchor_temporal: 0.04
    lambda_slot_area_order: 0.05
    lambda_phase_slot_correlation: 0.01
    temporal_state:
      detach_state: true
      detach_every: 1

main_training:
  unext_lr_ratio: 0.2
  functional_anchor_lr_ratio: 1.0
