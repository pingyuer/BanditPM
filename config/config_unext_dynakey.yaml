defaults:
  - config_gdkvm_01
  - _self_

exp_id: "unext_dynakey"
model_name: "UNeXtDynaKey"
output_root: "outputs/BanditPM"

phase_init:
  train: "pred_or_zero"
  val: "pred_or_zero"
  test: "pred_or_zero"

evaluation:
  init_mode: "pred_or_zero"
  exclude_init_frame: true
  init_frame_index: 0
  protocol_version: "v2_no_leak_unext_dynakey"
  default_threshold: 0.5
  threshold_search_start: 0.30
  threshold_search_end: 0.70
  threshold_search_step: 0.05


model:
  name: "unext_dynakey"
  allow_oracle_init_when_requested: false
  use_first_frame_gt_init: false
  use_kpff: false
  memory_core:
    type: "dynakey"
    dynakey:
      BANK_SIZE: 4
      DT: 1.0
      EMA_ALPHA: 0.2
      RETRIEVAL_TEMPERATURE: 1.0
      MIN_SCALE: 1.0e-3
      HIDDEN_DIM: 128
      GATE_INIT: 1.0
      POLICY_MODE: "fixed_residual"
      FORCED_ACTION: null
      RESIDUAL_SPAWN_THRESHOLD: 0.05
      SPLIT_EPS: 0.01
      SPLIT_SCALE_FACTOR: 0.7
      ENABLE_Q_LOSS: false
      DETACH_Q_STATE: true
  temporal_memory:
    type: "dynakey"
    bpm:
      ENABLE: false
  unext_dynakey:
    in_channels: 1
    num_classes: 2
    base_dim: 32
    value_dim: 128
    use_dynakey: true
    dynakey_memory_mode: "global"   # global | spatial
    use_phase_retrieval: false
    readout_type: "global_broadcast" # global_broadcast | spatial_gate
    memory_fusion_level: "late"       # late | decoder
    prediction_mode: "base_residual"  # base_residual | memory_residual | memory_primary
    base_logits_weight: 1.0
    detach_base_logits: false
    base_prob_dropout: 0.0
    decoder_feature_dropout: 0.0
    freeze_unext: false
    memory_only_head_enabled: false
    lambda_memory_only: 0.0
    mid_memory_fusion_init_scale: 0.1
    mid_memory_gate_bias: -2.0
    dynamics_mode: "global"          # none | global | spatial
    q_policy_mode: "off"             # off | diagnostic | training
    q_reward_type: "segmentation_gain" # segmentation_gain | latent
    enable_q_loss: false
    return_debug_aux: true
    use_temporal_refine: true
    use_mask_memory: true
    use_memory_readout: true
    temporal_residual_init_scale: 0.1
    temporal_gate_bias: -2.0
    clamp_temporal_residual: true
    temporal_residual_clip: 3.0
    mask_memory_slots: 4
    mask_memory_temperature: 0.1
    mask_memory_ema: 0.9
    mask_memory_confidence_threshold: 0.55
    mask_memory_fg_ratio_min: 0.005
    mask_memory_fg_ratio_max: 0.60
    mask_memory_area_change_limit: null
    spatial_memory_slots: 4
    spatial_memory_size: 16
    spatial_memory_temperature: 0.1
    spatial_memory_ema: 0.9
    spatial_retrieval_weight: 1.0
    shape_retrieval_weight: 1.0
    phase_retrieval_weight: 1.0
    spatial_readout_scale: 0.1
    spatial_memory_confidence_threshold: 0.55
    spatial_memory_fg_ratio_min: 0.005
    spatial_memory_fg_ratio_max: 0.60
    spatial_dynamics_momentum: 0.8
    lambda_q_ce: 1.0
    teacher_forcing_update_memory:
      enabled: true
      start_prob: 0.5
      end_prob: 0.0
      warmup_iters: 300
      apply_to: "memory_update_only"
    use_ode_aux_loss: false

hydra:
  run:
    dir: ${output_root}/${exp_id}/${now:%Y-%m-%d}/${now:%H-%M-%S}
