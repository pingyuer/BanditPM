# @package _global_
main_training:
  name: "main_training"
  enabled: true
  num_iterations: 3000
  batch_size: 16
  num_workers: 8
  amp: true
  learning_rate: 1.0e-4
  lr_schedule: step
  lr_schedule_gamma: 0.1
  lr_schedule_steps: [1000, 2000]
  val_interval: 200
  save_interval: 200
  point_supervision: true
  train_num_points: 12544
  oversample_ratio: 3.0
  importance_sample_ratio: 0.75
  clip_grad_norm: 3.0
  weight_decay: 0.001
  embed_weight_decay: 0.0
  backbone_lr_ratio: 0.1
  cardia_offset_lr_mult: 1.5
  cardia_selector_lr_mult: 2.0
  cardia_boundary_lr_mult: 2.0
  cardia_proposal_lr_mult: 2.0
  num_ref_frames: 10
  seq_length: 10
  num_objects: 1
  pos_weight_val: 2.0
