# UNeXt GridAnchorRouter
model_name: "UNeXtGAR"

model:
  name: "unext_gar"
  allow_oracle_init_when_requested: false
  aux_loss:
    sensory:
      weight: 0.0
    query:
      weight: 0.0
  temporal_memory:
    type: none
    bpm:
      ENABLE: false
  unext_gar:
    in_channels: 1
    num_classes: 2
    base_dim: 120
    value_dim: 256
    num_heads: 4
    hidden_dim: null
    stage3_max_offset_px: 2.0
    stage2_max_offset_px: 3.0
    padding_mode: "border"
    align_corners: false
    detach_state: true
    write_gate_bias: -0.5
    require_pretrained_unext: false
    pretrained_unext_path: null
    pretrained_unext_strict_backbone: false
    lambda_gar_base: 0.1
    lambda_gar_proposal_oracle: 0.2
    lambda_gar_selector: 0.1
    lambda_gar_flow_smooth: 0.005
    lambda_gar_boundary_aux: 0.02
    selector_temperature: 0.1
    proposal_loss: "best"
