# CARDIA: Cardiac Anchor-guided Runtime Deformation Integration Architecture
model_name: "CARDIA"

model:
  name: "cardia"
  allow_oracle_init_when_requested: false
  aux_loss:
    sensory:
      weight: 0.0
    query:
      weight: 0.0
  temporal_memory:
    type: none
    bpm:
      ENABLE: false
  cardia:
    in_channels: 1
    num_classes: 2
    base_dim: 120
    value_dim: 256
    hidden_dim: 128
    runtime_token_dim: 32
    stage3_num_heads: 1
    stage2_num_heads: 3
    stage3_max_offset_px: 1.5
    stage2_max_offset_px: 3.0
    padding_mode: "border"
    align_corners: false
    detach_runtime_state: true
    write_gate_bias: -0.5
    stage3_write_gate_bias: 0.0
    stage2_write_gate_bias: -0.5
    selector_logit_scale_init: 2.0
    selector_logit_scale_max: 8.0
    stage3_injection_scale: 0.5
    stage3_injection_learnable: true
    stage3_injection_max: 1.0
    stage3_gamma_init: 0.03
    stage2_gamma_init: 0.05
    boundary_gamma_init: 0.03
    stage3_decay_gate: true
    stage3_decay_gate_bias: 0.5
    stage2_head_bias_eps: 0.001
    boundary_edge_gate_floor: 0.05
    boundary_edge_gate_bias: -1.0
    boundary_dilation_kernel: 5
    require_pretrained_unext: false
    pretrained_unext_path: null
    pretrained_unext_strict_backbone: false
    lambda_cardia_base: 0.1
    lambda_cardia_base_after: 0.05
    base_aux_after_iter: 800
    lambda_cardia_proposal_oracle: 0.2
    lambda_cardia_proposal_oracle_after: 0.1
    oracle_decay_start_iter: 2500
    lambda_cardia_selector: 0.1
    lambda_cardia_flow_smooth: 0.002
    lambda_cardia_stage3_flow_smooth: 0.003
    lambda_cardia_stage2_flow_smooth: 0.0015
    flow_smooth_warmup_iters: 500
    lambda_cardia_boundary_aux: 0.02
    selector_temperature: 0.1
    proposal_softmin_temperature: 0.3
    proposal_loss: "soft_oracle"
