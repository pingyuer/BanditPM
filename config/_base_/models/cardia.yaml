# CARDIA: Cardiac Anchor-guided Runtime Deformation Integration Architecture
model_name: "CARDIA"

model:
  name: "cardia"
  allow_oracle_init_when_requested: false
  aux_loss:
    sensory:
      weight: 0.0
    query:
      weight: 0.0
  temporal_memory:
    type: none
    bpm:
      ENABLE: false
  cardia:
    memory_type: "kv"
    backbone:
      name: "official"  # current | official
      official:
        mlp_expansion: 2.0
        latent_blocks: 2
        decoder_mlp_blocks: 1
    in_channels: 1
    num_classes: 2
    base_dim: 120
    value_dim: 256
    hidden_dim: 256
    runtime_token_dim: 32
    use_cardiac_context: true
    cardiac_context_detach_observation: true
    cardiac_context_hidden_dim: 64
    cardiac_context_gate_init: 0.35
    dynamic_context_trust_floor: 0.35
    deformation_source: "memory"
    kv_memory:
      key_dim: 64
      stage3_value_dim: 240
      stage2_value_dim: 120
      hidden_dim: 128
      write_bias: -1.0
      decay_bias: 1.0
      reliability_floor: 0.05
    sldm:
      key_dim: 64
      value_dim: 128
      zero_init: true
      use_rmsnorm: true
      detach_memory_state: true
      forget_bias: 1.0
      write_bias: -1.0
    stage3_num_heads: 1
    stage2_num_heads: 4
    stage3_max_offset_px: 1.5
    stage2_max_offset_px: 3.5
    stage3_head_scales: [1.0]
    stage2_head_scales: [0.4, 0.8, 1.2, 1.8]
    padding_mode: "border"
    align_corners: false
    detach_runtime_state: true
    write_gate_bias: 0.0
    stage3_write_gate_bias: 0.0
    stage2_write_gate_bias: -0.5
    selector_logit_scale_init: 0.3
    selector_logit_scale_max: 2.0
    stage3_injection_scale: 0.5
    stage3_injection_learnable: true
    stage3_injection_max: 1.0
    stage3_gamma_init: 0.03
    stage2_gamma_init: 0.05
    boundary_gamma_init: 0.05
    stage3_decay_gate: true
    stage3_decay_gate_bias: 0.5
    stage2_head_bias_eps: 0.01
    boundary_edge_gate_floor: 0.05
    boundary_edge_gate_bias: 0.0
    boundary_dilation_kernel: 5
    runtime_logit_fusion:
      enabled: true
      hidden_dim: 96
      init_biases: [1.0, 0.8, -0.2, -0.2, -0.6]
      temperature_init: 1.0
      temperature_min: 0.35
      temperature_max: 4.0
    require_pretrained_unext: false
    pretrained_unext_path: null
    pretrained_unext_strict_backbone: false
    lambda_cardia_base: 0.1
    lambda_cardia_base_after: 0.05
    base_aux_after_iter: 800
    lambda_cardia_proposal_oracle: 0.2
    lambda_cardia_proposal_oracle_after: 0.1
    oracle_decay_start_iter: 2500
    lambda_cardia_proposal_top1: 0.05
    lambda_cardia_selector: 0.0
    lambda_cardia_selector_global: 0.05
    lambda_cardia_selector_spatial: 0.08
    lambda_cardia_selector_margin: 0.0
    lambda_cardia_selector_margin_global: 0.025
    lambda_cardia_selector_margin_spatial: 0.05
    selector_margin: 0.2
    lambda_cardia_flow_smooth: 0.005
    lambda_cardia_stage3_flow_smooth: 0.003
    lambda_cardia_stage2_flow_smooth: 0.003
    flow_smooth_warmup_iters: 500
    lambda_cardia_boundary_aux: 0.02
    lambda_cardia_memory_readout: 0.08
    lambda_cardia_memory_readout_stage3: 0.04
    lambda_cardia_reliability_write: 0.01
    lambda_head_diversity: 0.05
    lambda_cardia_multi_head_fused: 0.0
    activation: "GELU"
    backbone_init: "default"
    use_cross_attention: false
    use_multi_head_fusion: false
    selector_temperature: 0.1
    proposal_softmin_temperature: 0.3
    proposal_loss: "soft_oracle"
