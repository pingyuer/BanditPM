# @package _global_
model_name: "UNeXtAnchorODE"

model:
  name: "anchor_ode"
  allow_oracle_init_when_requested: false
  use_first_frame_gt_init: false
  use_kpff: false
  memory_core:
    type: "none"
    dynakey: {}
  temporal_memory:
    type: "none"
    bpm:
      ENABLE: false
  aux_loss:
    sensory:
      weight: 0.0
    query:
      weight: 0.0
  anchor_ode:
    in_channels: 1
    num_classes: 2
    base_dim: 32
    value_dim: 128
    num_slots: 8
    state_dim: 128
    hidden_dim: 128
    anchor_size: 32
    condition_dim: 64
    ode_steps: 1
    ode_gamma: 0.1
    prior_residual_clip: 3.0
    lambda_prior: 0.2
    lambda_multiscale_prior: 0.02
    lambda_geo: 0.05
    lambda_temp_geo: 0.02
    lambda_conf: 0.02
    lambda_slot_balance: 0.001
