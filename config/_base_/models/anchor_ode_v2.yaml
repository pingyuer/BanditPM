# @package _global_
model_name: "UNeXtAnchorODEAffine"

model:
  name: "anchor_ode_v2"
  allow_oracle_init_when_requested: false
  use_first_frame_gt_init: false
  use_kpff: false
  memory_core:
    type: "none"
    dynakey: {}
  temporal_memory:
    type: "none"
    bpm:
      ENABLE: false
  aux_loss:
    sensory:
      weight: 0.0
    query:
      weight: 0.0
  anchor_ode:
    mode: "current_anchor_affine"
    in_channels: 1
    num_classes: 2
    base_dim: 32
    value_dim: 128
    num_slots: 8
    state_dim: 128
    hidden_dim: 128
    condition_dim: 64
    ode_steps: 1
    ode_gamma: 0.1
    prior_residual_clip: 2.0
    affine_max_translate: 0.12
    affine_max_scale: 0.10
    affine_max_rotate: 0.15
    gate_warmup_iters: 500
    lambda_base_seg: 0.5
    lambda_prior: 0.1
    lambda_warp_prior: 0.1
    lambda_multiscale_prior: 0.02
    lambda_geo: 0.05
    lambda_temp_geo: 0.02
    lambda_conf: 0.05
    lambda_slot_balance: 0.001
    lambda_affine_reg: 0.02
