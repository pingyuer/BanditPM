model_name: "DEBEL"

model:
  name: "debel"
  allow_oracle_init_when_requested: false
  aux_loss:
    sensory:
      weight: 0.0
    query:
      weight: 0.0
  debel:
    in_channels: 1
    num_classes: 2
    enable_temporal: true
    backbone:
      name: official
      base_dim: 120
      mlp_expansion: 2.0
      latent_blocks: 2
      decoder_mlp_blocks: 1
    d_model: 192
    temporal_layers: 4
    temporal_heads: 6
    mlp_ratio: 4.0
    dropout: 0.1
    spatial_token_hw: 8
    summary_tokens: 4
    dense_tokens: 64
    solver_queries: 8
    solver_steps: 2
    share_solver_weights: true
    max_disp: 0.05
    grid_head_channels: 64
    align_corners: true
    padding_mode: border
    use_residual: true
    residual_alpha_max: 0.2

loss:
  name: debel
  debel:
    lambda_final: 1.0
    lambda_anchor: 0.5
    lambda_grid: 0.01
    lambda_smooth: 0.02
    lambda_temp: 0.01
    lambda_area: 0.001
    lambda_residual: 0.005

mlflow:
  tags:
    method: DEBEL
    full_name: "DETR-Enhanced Bounded Eulerian Latent-flow"
