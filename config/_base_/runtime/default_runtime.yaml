# @package _global_
output_root: "outputs/BanditPM"

mlflow:
  enabled: true
  artifacts_enabled: true
  required: true
  artifacts_required: true
  preflight: false
  stage: "full"
  timeout_seconds: 30
  tracking_uri: "http://172.16.240.77:5000"
  experiment_name: null
  run_name: null
  resume_run_id: null
  command_log_path: null

log_text_interval: 100
log_image_interval: 500

evaluation:
  # Keep train-run eval meaningful, but avoid repeating dense threshold grids at
  # every validation. Postprocess/test still run on the active threshold.
  threshold_search_during_training: true
  threshold_search_interval: 2000

eval_stage:
  final_eval: true
  final_test: true
  test_every_eval: true
  test_interval: 0
  num_vis: 2
