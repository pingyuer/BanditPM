defaults:
  - anchor_ode_v2_tuned_camus
  - _self_

exp_id: "anchor_ode_v2_camus_trust_guided"


model:
  anchor_ode:
    affine_max_translate: 0.12
    affine_max_scale: 0.10
    affine_max_rotate: 0.15
    gate_init_bias: -2.5
    confidence_prior_bias: -0.5
    lambda_conf: 0.02
    lambda_guided_seg: 0.2
    lambda_affine_reg: 0.01

main_training:
  num_iterations: 4000
  lr_schedule: step
  lr_schedule_steps: [2000, 3200]
  lr_schedule_gamma: 0.1
  weight_decay: 0.001
  embed_weight_decay: 0.0
  clip_grad_norm: 3.0
  unext_lr_ratio: 0.5
  anchor_ode_lr_ratio: 1.5

augmentation:
  enabled: false

evaluation:
  protocol_version: "v3_current_anchor_affine"
  postprocess:
    enabled: true
    min_size: 16
