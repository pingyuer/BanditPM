defaults:
  - echonet_ed2es_endpoint_predinit
  - _base_/datasets/echo
  - _base_/models/unext_ode_affine
  - _base_/runtime/default_runtime
  - _base_/schedules/default_3k
  - _self_

exp_id: "unext_ode_affine_echo"

main_training:
  num_iterations: 4000
  batch_size: 12
  num_workers: 10
  lr_schedule: step
  lr_schedule_steps: [2000, 3200]
  lr_schedule_gamma: 0.1
  unext_lr_ratio: 0.5
  functional_anchor_lr_ratio: 1.0
  residual_head_lr_mult: 5.0
  use_ema: false
  ema_eval: false

evaluation:
  protocol_version: "v3_unext_ode_affine"
  threshold_search_during_training: false
  threshold_search_start: 0.30
  threshold_search_end: 0.75
  threshold_search_step: 0.01
  tta:
    enabled: false
    modes: ["identity"]
  postprocess:
    enabled: true
    largest_component: true
    fill_holes: true
    remove_small_objects: true
    min_size: 16
    binary_closing: true

eval_stage:
  test_every_eval: false
  eval_interval: 500
  num_vis: 0
