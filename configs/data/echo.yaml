# @package _global_
dataset_name: "echonet"
data_path: "${processed_root}/echonet_png128_10f"

data:
  protocol_name: "echonet_ed2es_endpoint"

main_training:
  crop_size: [128, 128]

eval_stage:
  crop_size: [128, 128]

evaluation:
  init_mode: "pred_or_zero"
  frame_scope: "supervised_only"
  exclude_init_frame: true
  eval_protocol: "echonet_supervised_noinit"
  protocol_version: "v3_canonical_no_leak"
