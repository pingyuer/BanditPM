defaults:
  - dpfr_echonet_pediatric_a4c
  - _self_

exp_id: "dpfr_echonet_pediatric_fair_endpoint10"
prediction_mode: "dense10"
target_index: -1
temporal_access: "full_window"

model:
  backbone_pretrained: false
  pretrain_source: "none"

main_training:
  num_iterations: 4000
  batch_size: 2
  lr_schedule: warmup_cosine
  lr_warmup_iters: 300
  lr_min_ratio: 0.05

mlflow:
  experiment_name: "fair_dpfr_gdkvm_six_tasks"
  run_name: "dpfr_echonet_pediatric_fair_endpoint10"
  tags:
    method: "DPFR"
    dataset: "echonet_pediatric"
    protocol: "fair_endpoint10"
    task: "echonet_pediatric"
    temporal_access: "full_window"
    prediction_mode: "dense10"
    backbone_pretrained: "false"
