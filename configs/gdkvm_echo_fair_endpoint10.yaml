defaults:
  - gdkvm_echo
  - _self_

exp_id: "gdkvm_echo_fair_endpoint10"
prediction_mode: "dense10"
target_index: -1
temporal_access: "recurrent"

model:
  backbone_pretrained: false
  pretrain_source: "none"

main_training:
  num_iterations: 4000
  batch_size: 8
  lr_schedule: warmup_cosine
  lr_warmup_iters: 300
  lr_min_ratio: 0.05

mlflow:
  experiment_name: "gdkvm_dpfr_fair_six_tasks"
  run_name: "gdkvm_echo_fair_endpoint10"
  tags:
    method: "GDKVM"
    dataset: "echonet"
    protocol: "fair_endpoint10"
    temporal_access: "recurrent"
    prediction_mode: "dense10"
    backbone_pretrained: "false"
    task: "echonet_adult"
