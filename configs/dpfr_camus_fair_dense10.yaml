defaults:
  - dpfr_camus
  - _self_

exp_id: "dpfr_camus_fair_dense10"
prediction_mode: "dense10"
target_index: -1
temporal_access: "full_window"

model:
  backbone_pretrained: false
  pretrain_source: "none"
  dpfr:
    mask_prompt_train:
      gt_prob_start: 1.0
      gt_prob_end: 0.0
      schedule_iters: 1000
      mask_prob: 0.05

main_training:
  num_iterations: 4000
  batch_size: 2
  lr_schedule: warmup_cosine
  lr_warmup_iters: 300
  lr_min_ratio: 0.05

mlflow:
  experiment_name: "fair_dpfr_gdkvm_six_tasks"
  run_name: "dpfr_camus_fair_dense10_resfusion"
  tags:
    method: "DPFR"
    variant: "residual_fusion_anchor_safe"
    dataset: "camus"
    protocol: "fair_dense10"
    temporal_access: "full_window"
    prediction_mode: "dense10"
    task: "camus"
